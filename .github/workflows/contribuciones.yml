# Redibuja el grafico de contribuciones de la cuenta de trabajo una vez por dia,
# para que el numero del README no quede viejo. Los datos son publicos.
name: contribuciones

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/contribuciones.mjs
      - name: commitear si cambio
        run: |
          if [ -n "$(git status --porcelain assets/contribuciones.svg)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/contribuciones.svg
            git commit -m 'chore: contribuciones al dia'
            git push
          else
            echo 'sin cambios'
          fi
