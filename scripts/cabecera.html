<!doctype html>
<meta charset="utf-8">
<!-- Cabecera del README. Manual de marca: hormigon de fondo, vacio para el
     texto, Dharma Gothic con Aileron de respaldo, titulo en caja baja y recto,
     y la trama de los tensores solo donde no hay texto. Las piezas de la
     derecha son las del mapa de proyectos del portfolio. -->
<link rel="stylesheet" href="https://use.typekit.net/tyi0xxl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 320px; background: #a8a49b; font-family: 'IBM Plex Mono', monospace; overflow: hidden; }
  .cabecera {
    position: relative; width: 100%; height: 100%;
    padding: 44px 48px;
    display: flex; flex-direction: column; justify-content: space-between;
    /* Los agujeros de los tensores: solo en el vacio de la derecha */
    background-image:
      radial-gradient(ellipse 58% 120% at 22% 50%, #a8a49b 62%, transparent 100%),
      radial-gradient(circle at center, rgba(21, 19, 15, 0.22) 0 1.6px, transparent 1.7px);
    background-size: 100% 100%, 34px 34px;
  }
  .etiqueta { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(21,19,15,.62); }
  .nombre {
    font-family: 'dharma-gothic-e', 'Aileron', sans-serif; font-weight: 700; font-style: normal;
    font-size: 132px; line-height: .82; color: #15130f; letter-spacing: .01em;
  }
  .rol { font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: #15130f; margin-top: 14px; }
  .pie { display: flex; gap: 28px; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(21,19,15,.62);
         border-top: 1px solid rgba(21,19,15,.25); padding-top: 18px; }
  .pie b { color: #15130f; font-weight: 500; }
</style>
<div class="cabecera">
  <div>
    <p class="etiqueta">Software engineer · Buenos Aires · Remote</p>
  </div>
  <div>
    <h1 class="nombre">Luciano Balbiano</h1>
    <p class="rol">Spec-driven development · AI in production</p>
  </div>
  <div class="pie">
    <span><b>Dmeter</b> · co-founder</span>
    <span><b>Invisible Geeks</b> · team leader</span>
    <span>balbianoluciano.github.io</span>
  </div>
</div>
